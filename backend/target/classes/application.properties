spring.application.name=transit-pulse
server.port=8080

# CORS — allow React dev server
transit.pulse.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Anomaly detection thresholds (percentage, absolute values)
transit.pulse.analysis.alert-decline-pct=15.0
transit.pulse.analysis.warning-decline-pct=8.0
transit.pulse.analysis.alert-surge-pct=20.0
transit.pulse.analysis.warning-surge-pct=12.0
transit.pulse.analysis.schedule-alert-pct=85.0
transit.pulse.analysis.schedule-warning-pct=92.0
transit.pulse.analysis.min-baseline-passengers=100
transit.pulse.analysis.max-exceptions-in-brief=5

# AI configuration
transit.pulse.ai.api-key=${CLAUDE_API_KEY:}
transit.pulse.ai.model=claude-sonnet-4-5
transit.pulse.ai.timeout-seconds=10
transit.pulse.ai.max-words=300

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
